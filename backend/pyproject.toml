[project]
name = "mote"
version = "0.1.0"
description = "Local-first photo curator: discovers mood- and subject-based themes in a photo archive."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "numpy>=1.26",
    "pillow>=10.4",
]

[project.optional-dependencies]
# Heavy ML stack; the embedding model itself is chosen later.
ml = [
    "torch>=2.4",
    "scikit-learn>=1.5",
    "umap-learn>=0.5",
    "hdbscan>=0.8",
]
raw = ["rawpy>=0.22"]

[project.scripts]
mote = "mote.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyinstaller>=6.10",
]
research = [
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mote"]

[tool.hatch.build.targets.wheel.force-include]
"src/mote/db/migrations" = "mote/db/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
